services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_db
    volumes:
      # Postgres 18 moved the data directory under /var/lib/postgresql/<major>/docker,
      # so the volume has to be mounted one level up from the pre-18 location.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: main_db
      DB_PORT: 5432
    ports:
      - "8080:8080"
    volumes:
      - .:/backend
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
